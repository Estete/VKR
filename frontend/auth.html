<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — PC Builder</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>PC Builder AI</h1>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Вход</button>
      <button class="auth-tab" data-tab="register">Регистрация</button>
    </div>

    <!-- Форма входа -->
    <form id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Войти</button>
    </form>

    <!-- Форма регистрации -->
    <form id="register-form" class="hidden">
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" id="reg-username" placeholder="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" placeholder="Минимум 6 символов" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Создать аккаунт</button>
    </form>

    <p class="auth-error" id="auth-error"></p>
  </div>
</div>

<script src="/app.js"></script>
<script>
  // Если уже залогинен — в чат
  getMe().then(() => { window.location.href = '/chat.html'; }).catch(() => {});

  // Переключение вкладок
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const which = tab.dataset.tab;
      document.getElementById('login-form').classList.toggle('hidden', which !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', which !== 'register');
      document.getElementById('auth-error').textContent = '';
    });
  });

  function setError(msg) {
    document.getElementById('auth-error').textContent = msg;
  }

  // Вход
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Вход...';
    try {
      await api('POST', '/api/auth/login', {
        email:    document.getElementById('login-email').value.trim(),
        password: document.getElementById('login-password').value,
      });
      window.location.href = '/chat.html';
    } catch (err) {
      setError(err.message);
      btn.disabled = false;
      btn.textContent = 'Войти';
    }
  });

  // Регистрация
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    btn.textContent = 'Создание...';
    try {
      await api('POST', '/api/auth/register', {
        username: document.getElementById('reg-username').value.trim(),
        email:    document.getElementById('reg-email').value.trim(),
        password: document.getElementById('reg-password').value,
      });
      window.location.href = '/chat.html';
    } catch (err) {
      setError(err.message);
      btn.disabled = false;
      btn.textContent = 'Создать аккаунт';
    }
  });
</script>
</body>
</html>
