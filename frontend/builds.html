<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои сборки — PC Builder</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-layout">

  <header class="page-header">
    <a href="/chat.html" class="back-link">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Назад
    </a>
    <h1>Мои сборки</h1>
  </header>

  <div class="page-body">
    <div class="builds-grid" id="builds-grid"></div>
    <div class="builds-empty hidden" id="builds-empty">
      <p>У вас ещё нет сохранённых сборок</p>
      <a href="/chat.html" class="btn btn-primary" style="display:inline-flex;width:auto">Перейти в чат</a>
    </div>
  </div>

</div>

<!-- ── Панель детального просмотра сборки ── -->
<div class="build-detail-overlay hidden" id="detail-overlay"></div>
<div class="build-detail-panel" id="detail-panel">
  <div class="panel-header">
    <button class="btn-collapse" id="btn-close-detail" title="Закрыть">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <span class="panel-title" id="detail-title">Сборка</span>
  </div>
  <div class="panel-body" id="detail-body"></div>
</div>

<script src="/app.js"></script>
<script>
  const CATEGORY_ORDER  = ['cpu','motherboard','memory','video_card','storage','power_supply','case','cooler'];
  const CATEGORY_LABELS = {
    cpu: 'Процессор', motherboard: 'Материнская плата', memory: 'Оперативная память',
    video_card: 'Видеокарта', storage: 'Накопитель',
    power_supply: 'Блок питания', case: 'Корпус', cooler: 'Охлаждение',
  };
  const PURPOSE_LABELS = {
    gaming: 'Игровой ПК', workstation: 'Рабочая станция',
    rendering: 'Рендеринг / 3D', office: 'Офисный ПК', streaming: 'Стриминг',
  };

  (async () => {
    await requireAuth();
    await loadBuilds();
  })();

  // ── Загрузка и рендер карточек ───────────────────────────────

  async function loadBuilds() {
    try {
      const builds = await api('GET', '/api/builds');
      const grid   = document.getElementById('builds-grid');
      const empty  = document.getElementById('builds-empty');

      if (!builds.length) { empty.classList.remove('hidden'); return; }

      const details = await Promise.all(
        builds.map(b => api('GET', `/api/builds/${b.id}`).catch(() => ({ ...b, components: [] })))
      );
      details.forEach(d => grid.appendChild(buildCard(d)));
    } catch { /* ignore */ }
  }

  function buildCard(build) {
    const card = document.createElement('div');
    card.className = 'build-card';

    const sorted = (build.components || []).slice().sort(
      (a, b) => CATEGORY_ORDER.indexOf(a.category) - CATEGORY_ORDER.indexOf(b.category)
    );

    const utilPct = build.budget
      ? Math.round((parseFloat(build.total_price) / parseFloat(build.budget)) * 100)
      : null;

    // Краткий список: первые 4 компонента
    const preview = sorted.slice(0, 4).map(c => `
      <div class="bc-row">
        <span class="bc-cat">${CATEGORY_LABELS[c.category] ?? c.category}</span>
        <span class="bc-name">${c.name ?? '—'}</span>
        <span class="bc-price">$${parseFloat(c.price).toFixed(0)}</span>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="build-card-header">
        <div>
          <div class="build-card-purpose">${PURPOSE_LABELS[build.purpose] ?? build.purpose}</div>
          <div class="build-card-date">${formatDate(build.created_at)}</div>
        </div>
        <button class="btn-delete" title="Удалить сборку">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
      <div class="build-card-price">$${parseFloat(build.total_price).toFixed(0)}</div>
      <div class="build-card-budget">Бюджет: $${parseFloat(build.budget).toFixed(0)}${utilPct != null ? ` · ${utilPct}%` : ''}</div>
      <div class="bc-components">${preview}</div>
      ${sorted.length > 4 ? `<div class="bc-more">Открыть подробнее →</div>` : ''}
    `;

    card.querySelector('.btn-delete').addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Удалить эту сборку?')) return;
      try {
        await api('DELETE', `/api/builds/${build.id}`);
        card.remove();
        closeDetail();
        if (!document.getElementById('builds-grid').children.length)
          document.getElementById('builds-empty').classList.remove('hidden');
      } catch { alert('Не удалось удалить сборку'); }
    });

    card.addEventListener('click', () => openDetail(build, sorted));
    return card;
  }

  // ── Панель детального просмотра ──────────────────────────────

  document.getElementById('btn-close-detail').addEventListener('click', closeDetail);
  document.getElementById('detail-overlay').addEventListener('click', closeDetail);

  function openDetail(build, sorted) {
    const purposeLabel = PURPOSE_LABELS[build.purpose] ?? build.purpose;
    document.getElementById('detail-title').textContent = purposeLabel;

    const utilPct = build.budget
      ? Math.round((parseFloat(build.total_price) / parseFloat(build.budget)) * 100)
      : null;

    const rows = sorted.map(c => `
      <div class="component-row">
        <span class="component-cat">${CATEGORY_LABELS[c.category] ?? c.category}</span>
        <div class="component-info">
          <div class="component-name">${c.name ?? '—'}</div>
          <div class="component-price">$${parseFloat(c.price).toFixed(2)}</div>
        </div>
      </div>
    `).join('');

    document.getElementById('detail-body').innerHTML = `
      <div class="build-total">
        $${parseFloat(build.total_price).toFixed(2)}
        ${utilPct != null
          ? `<span>из $${parseFloat(build.budget).toFixed(0)} · ${utilPct}%</span>`
          : ''}
      </div>
      <div class="build-meta-row">
        <span class="build-meta-label">Назначение</span>
        <span>${purposeLabel}</span>
      </div>
      <div class="build-meta-row">
        <span class="build-meta-label">Сохранено</span>
        <span>${formatDate(build.created_at)}</span>
      </div>
      <div class="components-list" style="margin-top:20px">${rows}</div>
    `;

    document.getElementById('detail-panel').classList.add('open');
    document.getElementById('detail-overlay').classList.remove('hidden');
  }

  function closeDetail() {
    document.getElementById('detail-panel').classList.remove('open');
    document.getElementById('detail-overlay').classList.add('hidden');
  }
</script>
</body>
</html>
